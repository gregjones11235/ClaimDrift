name: create_drift_pattern
enabled: true
description: |
  Writes a brand-new drift pattern into the `drift_patterns` index. Called by
  Memory Synthesizer (contracts.md §3.5) when retrieval surfaced no
  sufficiently-similar existing pattern. Mints nothing server-side — the
  caller is responsible for generating the UUID, the timestamps, and the
  single-element source_event_ids list. See §9.3 for why the UUID and
  timestamp generation are pushed up to the caller (Workflows YAML has no
  native uuid() or now() step in the current preview).

  This workflow uses op_type=create so a (vanishingly rare) UUID collision
  surfaces as an Elasticsearch error rather than silently overwriting an
  unrelated pattern.

  `record_source` is intentionally not written: per §2.3, real
  (non-demo-seed) docs leave the field unset.

tags: ["claimdrift", "memory-loop", "write"]

triggers:
  - type: manual
    inputs:
      - name: pattern_id
        type: string
        required: true
        description: "UUID v4 generated by the caller (the LLM). Used as the document _id. Per §7.2."
      - name: pattern_description
        type: string
        required: true
        description: "Reusable abstract summary of the drift pattern, ELSER-searchable. 30-80 words. No DOIs/authors. See §3.5.2 writing guide."
      - name: pattern_type
        type: string
        required: true
        description: "One of numerical_softening | hedging_addition | claim_disappearance | effect_size_reduction | other. See §2.2.5."
      - name: domain_tags
        type: array
        required: true
        description: "Lowercase-hyphen tags, 3-6 entries mixing broad and specific. e.g. [\"covid-19\", \"clinical-trial\", \"rct\"]."
      - name: source_event_id
        type: string
        required: true
        description: "The drift_event.event_id that triggered this new pattern. Stored as the single element of source_event_ids; subsequent matching events grow this list via update_drift_pattern."
      - name: now_iso
        type: string
        required: true
        description: "ISO 8601 UTC timestamp with Z suffix (e.g. 2026-05-23T12:34:56Z). The LLM generates this from its own clock context. Used for BOTH created_at and last_updated_at on create."

steps:
  - name: create_pattern_doc
    type: elasticsearch.request
    with:
      method: PUT
      path: "/drift_patterns/_doc/{{ inputs.pattern_id }}?op_type=create&refresh=wait_for"
      body:
        pattern_id: "{{ inputs.pattern_id }}"
        pattern_description: "{{ inputs.pattern_description }}"
        pattern_type: "{{ inputs.pattern_type }}"
        domain_tags: "${{ inputs.domain_tags }}"
        source_event_ids:
          - "{{ inputs.source_event_id }}"
        support_count: 1
        created_at: "{{ inputs.now_iso }}"
        last_updated_at: "{{ inputs.now_iso }}"
