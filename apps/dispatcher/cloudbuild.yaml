# Cloud Build config for the claimdrift-dispatcher image. Repo-root build context.
#   gcloud builds submit . --config=apps/dispatcher/cloudbuild.yaml   (from the repo root)
# Deploy and pause / resume: deploy/pipeline.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--file=apps/dispatcher/Dockerfile", "--tag=us-central1-docker.pkg.dev/${PROJECT_ID}/claimdrift/claimdrift-dispatcher:latest", "."]
images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/claimdrift/claimdrift-dispatcher:latest
options:
  logging: CLOUD_LOGGING_ONLY
