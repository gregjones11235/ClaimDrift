# Cloud Build config for the claimdrift-dispatcher service.
#
# Why this file exists: `gcloud run deploy --source .` does not support a
# `--dockerfile` flag to point at a Dockerfile outside the build context root,
# but the dispatcher's Dockerfile is at apps/dispatcher/Dockerfile and needs
# repo-root build context (it COPYs apps/bff/sse_adapter.py — the §6.1 SSE
# translator shared with the BFF). So we do the build via `gcloud builds
# submit` with this config, then `gcloud run deploy --image`.
#
# Usage (from repo root):
#   gcloud builds submit . --config=apps/dispatcher/cloudbuild.yaml
#   gcloud run deploy claimdrift-dispatcher \
#     --image=us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/claimdrift-dispatcher:latest \
#     --region=us-central1 \
#     --allow-unauthenticated \
#     --update-env-vars="..." --set-secrets="..."

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/dispatcher/Dockerfile
      - --tag=us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/claimdrift-dispatcher:latest
      - .

images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/claimdrift-dispatcher:latest

options:
  logging: CLOUD_LOGGING_ONLY
