# Cloud Build config for the claimdrift-bff image (BFF service + citation-dispatch job). Repo-root build context.
#   gcloud builds submit . --config=apps/bff/cloudbuild.yaml          (from the repo root)
# Deploy steps: 新系统云端部署.md §4.5.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--file=apps/bff/Dockerfile", "--tag=us-central1-docker.pkg.dev/${PROJECT_ID}/claimdrift/claimdrift-bff:latest", "."]
images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/claimdrift/claimdrift-bff:latest
options:
  logging: CLOUD_LOGGING_ONLY
