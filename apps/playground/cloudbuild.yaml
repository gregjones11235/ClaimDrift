# Cloud Build config for the claimdrift-playground image. Repo-root build context.
#   gcloud builds submit . --config=apps/playground/cloudbuild.yaml   (from the repo root)
# Deploy steps: 新系统云端部署.md §4.5 (--timeout=3600, --max-instances=1: one run at a time, in-process lock).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--file=apps/playground/Dockerfile", "--tag=us-central1-docker.pkg.dev/${PROJECT_ID}/claimdrift/claimdrift-playground:latest", "."]
images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/claimdrift/claimdrift-playground:latest
options:
  logging: CLOUD_LOGGING_ONLY
